# Phase 1: db, pgadmin, backend, frontend.
# Phase 2: adds ml-service (ML_DRIVER=http) with shared_data volume + bind-mount weights.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Developer console only; safe to remove for an end-user deployment.
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      SHARED_DIR: /shared
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - shared_data:/shared
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # node:22-slim ships without wget/curl, so probe with Node's fetch.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # VITE_* values are baked into the bundle at build time; rebuild on change.
      args:
        VITE_FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS}
    env_file: .env
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase 2 — ML inference service
  # Set ML_DRIVER=http and ML_WEIGHTS_HOST_DIR in .env to activate.
  # ---------------------------------------------------------------------------
  ml-service:
    build: ./ml-service
    env_file: .env
    environment:
      SHARED_DIR: /shared
      WEIGHTS_DIR: /weights
      ML_SERVICE_PORT: "${ML_SERVICE_PORT:-8001}"
      ML_DEVICE: "${ML_DEVICE:-cpu}"
      CARIES_CONF: "${CARIES_CONF:-0.005}"
      DETECTION_THRESHOLD: "${DETECTION_THRESHOLD:-0.25}"
      ENABLE_CROP_SEGMENTER: "${ENABLE_CROP_SEGMENTER:-true}"
    ports:
      - "127.0.0.1:${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - shared_data:/shared
      - type: bind
        source: ${ML_WEIGHTS_HOST_DIR}
        target: /weights
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8001/health',timeout=5); sys.exit(0 if r.status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    profiles:
      - ml
    restart: unless-stopped

volumes:
  db_data:
  pgadmin_data:
  shared_data:
