server {
    listen 80;
    server_name localhost;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Serve the React SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /predict POST requests → backend FastAPI
    location /predict {
        proxy_pass         http://backend:8000/predict;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Allow large file uploads (panoramic X-ray images)
        client_max_body_size 50M;
        # Long timeout for ML inference
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Proxy /outputs → backend (annotated images served by FastAPI StaticFiles)
    location /outputs/ {
        proxy_pass         http://backend:8000/outputs/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # SPA fallback: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
